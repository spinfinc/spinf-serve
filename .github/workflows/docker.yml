# Builds the public image ghcr.io/spinfinc/spinf-serve from the released PyPI package and pushes it: on every release tag
# (the tag is the PyPI version), or by hand with a version. The package visibility (public) is set once in the repository's
# package settings; the workflow's own token can push to the registry of this repository.
name: docker
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: the spinf-serve version on PyPI to build (also the image tag)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    # the package belongs to the public repository: a fork or mirror that carries the tag has no write access to it
    if: github.repository == 'spinfinc/spinf-serve'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      # the torch stack is large; the runner's unused toolchains make room for the layers
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SPINF_SERVE_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/spinf-serve:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spinf-serve:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
